name: matchday_tracker
services:
  db:
    container_name: matchday-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?"set POSTGRES_PASSWORD in server/.env"}
      POSTGRES_DB: matchday_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - matchday_pgdata:/var/lib/postgresql/data

volumes:
  matchday_pgdata:
    name: matchday_pgdata