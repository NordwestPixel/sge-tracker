name: sge_server
services:
  db:
    container_name: sge-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?"set POSTGRES_PASSWORD in server/.env"}
      POSTGRES_DB: sge_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sge_pgdata:/var/lib/postgresql/data

volumes:
  sge_pgdata:
    name: sge_pgdata